site_name: WRO-FE-2025 - Mindcraft
site_description: Documentation for the Mindcraft WRO Future Engineers 2025 self-driving robot project
repo_name: DexterTaha/WRO-FE-2025-Mindcraft
repo_url: https://github.com/DexterTaha/WRO-FE-2025-Mindcraft
# Site URL used for GitHub Pages. Update if you publish under a different path.
site_url: https://DexterTaha.github.io/WRO-FE-2025-Mindcraft

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  custom_dir: overrides
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - tags
  - blog

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# Navigation - keep this mapping in sync with files under the `docs/` folder.
nav:
  - Home: index.md
  - Docs:
      - Docs: docsfile/docs.md
  - Models:
      - Models: models/models.md
      - Parts:
          - Robot Base: models/Parts/robotbase.md
          - Second layer: models/Parts/secondlayer.md
          - Wheel Support: models/Parts/WheelSupport.md
          - Gear: models/Parts/Gear.md
          - Berring Support Right: models/Parts/BerringSupportRight.md
          - stand off 2mm: models/Parts/standoff2mm.md
          - "Short Shaft": "models/Parts/Short Shaft.md"
          - "Long Shaft": "models/Parts/Long Shaft.md"
          - "Axle Clamp": "models/Parts/Axle Clamp.md"
          - "stand off 1mm": "models/Parts/stand off 1mm.md"
          - "Big Gear": "models/Parts/Big Gear.md"
          - "Front Support Camera": "models/Parts/Front Support Camera.md"
          - "Berring Support Left": "models/Parts/Berring Support Left.md"
          - "Back Support Camera": "models/Parts/Back Support Camera.md"
          - "Steering Conector": "models/Parts/Steering Conector.md"
          - "scwer shaft": "models/Parts/scwer shaft.md"
          - "Steering Rack": "models/Parts/Steering Rack.md"
  - Other:
      - BOM: otherfile/BOM.md
  - Schemes:
      - Schemes: schemesfile/schemes.md
  - t-photos:
      - t-photos: t-photosfile/t-photos.md
  - v-photos:
      - v-photos: v-photos/v-photos.md
